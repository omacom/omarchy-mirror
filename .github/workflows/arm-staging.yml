name: ARM staging

on:
  push:
    paths:
      - bin/omarchy-mirror-stage-arm
      - tests/**
      - .github/workflows/arm-staging.yml
  pull_request:
    paths:
      - bin/omarchy-mirror-stage-arm
      - tests/**
      - .github/workflows/arm-staging.yml

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  pacman:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed python git
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v
